  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycby1WiRhGdIHsaA6brxkaOVWn4mqS5cV3naYfKZmOJErpRJl0wkTUbSMIUrJLkTzkoPO/exec';
    const SESSION_EXPIRE_MINUTES = 120;

    // =========================================================================
    // HELPERS
    // =========================================================================
    function safeGetStorage(key) {
      try { return window.localStorage.getItem(key); } catch (e) { return null; }
    }
    function safeSetStorage(key, value) {
      try { window.localStorage.setItem(key, value); } catch (e) {}
    }
    function safeRemoveStorage(key) {
      try { window.localStorage.removeItem(key); } catch (e) {}
    }
    function normalizeApostrophes(str) {
      return String(str === null || str === undefined ? '' : str)
        .replace(/[\u2018\u2019\u201A\u201B\u2032\u2035\u0060\u00B4\u02BC\uFF07]/g, "'")
        .replace(/[\u201C\u201D\u201E\u201F\u2033\u2036\uFF02]/g, '"')
        .replace(/\u00A0/g, ' ');
    }
    function escapeHtml(str) {
      return normalizeApostrophes(str)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escapeJsAttr(str) {
      return normalizeApostrophes(str)
        .replace(/\\/g, '\\\\').replace(/'/g, "\\'")
        .replace(/"/g, '&quot;').replace(/\n/g, '\\n').replace(/\r/g, '');
    }
    function safeUrl(url) {
      const s = String(url || '').trim();
      return /^https?:\/\//i.test(s) ? s : '';
    }

    // =========================================================================
    // STATE
    // =========================================================================
    const dashState = {
      token: '',
      requirePin: true,
      rawRows: [],
      filteredRows: [],
      activeSessions: [],
      bankSoal: {},
      studentsByClass: {},
      allPackages: [],
      packageManagement: [],
      kkm: 80,
      security: {
        requireStudentPin: 'NO',
        requireTeacherPin: 'YES',
        showKey: 'HIDE',
        validPinCount: 0,
        totalStudentCount: 0
      },
      sortField: 'timestamp',
      sortDir: 'desc',
      missingList: [],
      analysisReport: [],
      currentPreviewItemIdx: -1,
      currentPreviewPaketId: '',
      previewData: null,
      previewFilterIssuesOnly: false,
      previewCollapsePassages: false,
      previewShowExplanations: true,
      activeTab: 'results',

      aggCache: new Map(),
      aggCacheKey: '',
      detailRequestId: 0,
      lastAnalysisKey: '',
      searchDebounce: null,
      previewReqId: 0,
      dummyFilter: 'HIDE'  // NEW
    };

    const TYPE_LABELS = {
      PG: 'Multiple Choice', PGK: 'Multiple Response', BS: 'True / False',
      MENJODOHKAN: 'Matching', MATRIKS: 'Matrix / Category', IS: 'Short Answer'
    };
    const EDITORIAL_PALETTE = ['#3e5b61', '#dcd695', '#678c93', '#d3dce0', '#8ea39d', '#c7be70'];
    const $ = (id) => document.getElementById(id);

    function isDummyRow(r) {
      return (r.kelas || '').trim() === '1111' ||
             (r.namaSiswa || '').trim().toLowerCase() === 'dummy';
    }

    // =========================================================================
    // API CALLER
    // =========================================================================
    function getClientId() {
      let cid = safeGetStorage('neng_eva_client_id');
      if (!cid) {
        cid = 'dash_' + Math.random().toString(36).substring(2, 12);
        safeSetStorage('neng_eva_client_id', cid);
      }
      return cid;
    }
    async function callApi(action, ...args) {
      if (window.location && window.location.protocol === 'file:') {
        throw new Error('Aplikasi tidak dapat dibuka dari file lokal. Buka menggunakan tautan HTTPS asli.');
      }
      let response;
      try {
        response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action, args })
        });
      } catch (networkErr) {
        throw new Error('Gagal terhubung ke server (' + (networkErr && networkErr.message ? networkErr.message : 'Network error') + ').');
      }
      if (!response.ok) throw new Error('Failed to connect (' + response.status + ').');
      const data = await response.json();
      if (data && data.status === 'error') {
        if (data.code === 'UNAUTHORIZED') handleSessionExpired();
        throw new Error(data.message || 'Server error.');
      }
      return data;
    }
    function showLoading(text) {
      $('loadingText').textContent = text || 'Loading...';
      $('loadingOverlay').classList.remove('hidden');
    }
    function hideLoading() { $('loadingOverlay').classList.add('hidden'); }
    let toastTimer = null;
    function showToast(msg) {
      const el = $('toastBox');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function stripMediaTags(text) {
      return normalizeApostrophes(text || '')
        .replace(/\[IMG:\s*[^\]]+\]/gi, '[Image]')
        .replace(/\[AUDIO:\s*[^\]]+\]/gi, '[Audio]')
        .replace(/\[(?:HEADER:\s*)?[^\]]+\]/gi, '')
        .replace(/<\/?(?:b|strong|u|i|em)>/gi, '')
        .replace(/\[\/?(?:b|u|i)\]/gi, '')
        .replace(/\*\*([^\*\n]+?)\*\*/g, '$1')
        .replace(/(^|[^_])__([^_\n](?:[^_\n]|_[^_\n])*?)__(?=[^_]|$)/g, '$1$2')
        .trim();
    }
    function formatRichMedia(rawText) {
      let text = escapeHtml(rawText || '');
      text = text
        .replace(/&lt;(\/?(?:b|strong|u|i|em))&gt;/gi, '<$1>')
        .replace(/\[b\]([\s\S]*?)\[\/b\]/gi, '<strong>$1</strong>')
        .replace(/\[u\]([\s\S]*?)\[\/u\]/gi, '<u>$1</u>')
        .replace(/\[i\]([\s\S]*?)\[\/i\]/gi, '<em>$1</em>')
        .replace(/\*\*([^\*\n]+?)\*\*/g, '<strong>$1</strong>')
        .replace(/(^|[^_])__([^_\n](?:[^_\n]|_[^_\n])*?)__(?=[^_]|$)/g, '$1<u>$2</u>');
      text = text.replace(/\[IMG:\s*([^\]]+)\]/gi, (_, u) => {
        const s = safeUrl(u.trim());
        return s ? `<br><img src="${s}" alt="Image" loading="lazy"><br>` : '';
      });
      text = text.replace(/\[AUDIO:\s*([^\]]+)\]/gi, (_, u) => {
        const s = safeUrl(u.trim());
        return s ? `<br><audio controls preload="none" src="${s}"></audio><br>` : '';
      });
      text = text.replace(/(^|\s)(https?:\/\/\S+\.(?:png|jpe?g|gif|webp)(?:\?\S*)?)/gi, (_, p, u) => {
        const s = safeUrl(u);
        return s ? `${p}<br><img src="${s}" alt="Image" loading="lazy"><br>` : `${p}${u}`;
      });
      text = text.replace(/(^|\s)(https?:\/\/\S+\.(?:mp3|wav|ogg|m4a)(?:\?\S*)?)/gi, (_, p, u) => {
        const s = safeUrl(u);
        return s ? `${p}<br><audio controls preload="none" src="${s}"></audio><br>` : `${p}${u}`;
      });
      return text;
    }

    function resolveQuestionPassages(questions) {
      let activePassage = '';
      return (questions || []).map((q) => {
        const copy = Object.assign({}, q);
        const raw = normalizeApostrophes(copy.teksBacaan).trim();
        if (raw === '-' || raw.toUpperCase() === 'NONE' || raw.toUpperCase() === 'NO PASSAGE') {
          activePassage = ''; copy._passage = '';
        } else if (raw !== '') {
          activePassage = raw; copy._passage = activePassage;
        } else {
          copy._passage = activePassage;
        }
        return copy;
      });
    }
    function getPackageName(paketId) {
      const found = dashState.allPackages.find(p => p.id === paketId);
      return found ? found.name : paketId;
    }
    function parseTimestampValue(ts, fallbackId) {
      const s = String(ts || '').trim();
      const m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
      if (m) {
        const parsed = new Date(Number(m[3]), Number(m[2]) - 1, Number(m[1]),
          Number(m[4] || 0), Number(m[5] || 0), Number(m[6] || 0)).getTime();
        if (!Number.isNaN(parsed)) return parsed;
      }
      const direct = Date.parse(s);
      if (!Number.isNaN(direct)) return direct;
      return Number(fallbackId) || 0;
    }

    // =========================================================================
    // AGGREGATION CACHE
    // =========================================================================
    function buildPackageAggregates(kelasFilter) {
      const agg = new Map();
      (dashState.allPackages || []).forEach(pkg => {
        agg.set(pkg.id, { bestMap: new Map(), passed: 0, remedial: 0, studentCount: 0 });
      });
      dashState.rawRows.forEach(r => {
        if (kelasFilter && r.kelas !== kelasFilter) return;
        if (isDummyRow(r)) return; // exclude dummy dari chart
        const bucket = agg.get(r.paketId);
        if (!bucket) return;
        const key = `${r.kelas}|${r.namaSiswa}`;
        const prev = bucket.bestMap.get(key);
        if (!prev || (Number(r.skorAkhir) || 0) > (Number(prev.skorAkhir) || 0)) {
          bucket.bestMap.set(key, r);
        }
      });
      agg.forEach(bucket => {
        bucket.studentCount = bucket.bestMap.size;
        bucket.bestMap.forEach(s => {
          if ((Number(s.skorAkhir) || 0) >= dashState.kkm || s.status === 'PASSED') bucket.passed++;
          else bucket.remedial++;
        });
      });
      return agg;
    }
    function getPackageAggregates(kelasFilter) {
      const key = kelasFilter || '__all__';
      if (dashState.aggCacheKey !== key) {
        dashState.aggCache = buildPackageAggregates(kelasFilter);
        dashState.aggCacheKey = key;
      }
      return dashState.aggCache;
    }

    // =========================================================================
    // AUTH
    // =========================================================================
    async function initDashboard() {
      showLoading('Checking dashboard access...');
      try {
        const authRes = await callApi('checkDashboardAuthMode');
        dashState.requirePin = Boolean(authRes.requirePin);
        if (!dashState.requirePin && authRes.token) {
          dashState.token = authRes.token;
          safeSetStorage('neng_eva_teacher_token', authRes.token);
          await enterWorkspace();
          return;
        }
        const savedToken = safeGetStorage('neng_eva_teacher_token');
        if (savedToken) {
          dashState.token = savedToken;
          try { await enterWorkspace(); return; }
          catch (e) { safeRemoveStorage('neng_eva_teacher_token'); dashState.token = ''; }
        }
        showLoginView();
      } catch (err) { showLoginView(err.message); }
      finally { hideLoading(); }
    }
    function showLoginView(errMsg) {
      $('dashboardSection').classList.add('hidden');
      $('btnToggleCharts').classList.add('hidden');
      $('btnRefresh').classList.add('hidden');
      $('btnLogout').classList.add('hidden');
      $('loginSection').classList.remove('hidden');
      const errBox = $('loginError');
      if (errMsg) { errBox.textContent = errMsg; errBox.classList.remove('hidden'); }
      else errBox.classList.add('hidden');
    }
    function handleSessionExpired() {
      safeRemoveStorage('neng_eva_teacher_token');
      dashState.token = '';
      showLoginView('Your session has expired. Please log in again.');
    }
    async function handleLoginSubmit(e) {
      e.preventDefault();
      const pin = $('inputTeacherPin').value.trim();
      if (!pin) return;
      $('loginError').classList.add('hidden');
      showLoading('Verifying Teacher PIN...');
      try {
        const res = await callApi('teacherLogin', pin, getClientId());
        dashState.token = res.token;
        safeSetStorage('neng_eva_teacher_token', res.token);
        $('inputTeacherPin').value = '';
        await enterWorkspace();
      } catch (err) {
        $('loginError').textContent = err.message;
        $('loginError').classList.remove('hidden');
      } finally { hideLoading(); }
    }
    async function handleLogout() {
      try { if (dashState.token) await callApi('teacherLogout', dashState.token); } catch (e) {}
      safeRemoveStorage('neng_eva_teacher_token');
      dashState.token = '';
      showLoginView('You have logged out of NEng Eva Dashboard.');
    }
    async function enterWorkspace() {
      $('loginSection').classList.add('hidden');
      $('dashboardSection').classList.remove('hidden');
      $('btnToggleCharts').classList.remove('hidden');
      $('btnRefresh').classList.remove('hidden');
      $('btnLogout').classList.toggle('hidden', !dashState.requirePin);
      const chartsHidden = safeGetStorage('neng_eva_hide_charts') === '1';
      $('chartsRowSection').classList.toggle('hidden', chartsHidden);
      $('btnToggleCharts').textContent = chartsHidden ? 'Show Charts' : 'Hide Charts';
      await loadAllDashboardData();
    }

    // =========================================================================
    // DATA LOAD
    // =========================================================================
    async function loadAllDashboardData() {
      showLoading('Loading test analytics & records...');
      try {
        const sinceDays = Number($('filterDays').value) || 0;
        const [dashRes, activeRes] = await Promise.all([
          callApi('getDashboardData', dashState.token, { sinceDays }),
          callApi('getActiveSessions', dashState.token).catch(() => ({ sessions: [] }))
        ]);
        dashState.rawRows = dashRes.data || [];
        dashState.bankSoal = dashRes.bankSoal || {};
        dashState.studentsByClass = dashRes.studentsByClass || {};
        dashState.allPackages = dashRes.allPackages || [];
        dashState.kkm = Number(dashRes.kkm) || 80;
        dashState.security = Object.assign(dashState.security, dashRes.security || {});
        dashState.aggCacheKey = '';
        dashState.lastAnalysisKey = '';
        populateFilterDropdowns();
        syncSecurityUI();
        renderActiveSessions(activeRes.sessions || []);
        applyFiltersAndRender();
      } finally { hideLoading(); }
    }
    function populateFilterDropdowns() {
      const prevPaket = $('filterPaket').value;
      const prevKelas = $('filterKelas').value;
      const prevMissingPaket = $('missingPaketSelect').value;
      const paketOptions = dashState.allPackages.map(p =>
        `<option value="${escapeHtml(p.id)}">${escapeHtml(p.name)} (${escapeHtml(p.id)})</option>`
      ).join('');
      $('filterPaket').innerHTML = '<option value="">All Packages</option>' + paketOptions;
      if (prevPaket) $('filterPaket').value = prevPaket;
      $('missingPaketSelect').innerHTML = '<option value="">-- Select Test Package --</option>' + paketOptions;
      if (prevMissingPaket || prevPaket) $('missingPaketSelect').value = prevPaket || prevMissingPaket;
      const classes = Object.keys(dashState.studentsByClass).sort();
      $('filterKelas').innerHTML = '<option value="">All Classes</option>' +
        classes.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
      if (prevKelas) $('filterKelas').value = prevKelas;
    }

    // =========================================================================
    // SORT
    // =========================================================================
    function sortResultRows(rows) {
      const field = dashState.sortField || 'timestamp';
      const dir = dashState.sortDir === 'asc' ? 1 : -1;
      const tsCache = new Map();
      rows.forEach(r => tsCache.set(r.id, parseTimestampValue(r.timestamp, r.id)));
      const getTs = (r) => tsCache.get(r.id) || 0;
      return rows.slice().sort((a, b) => {
        let cmp = 0;
        if (field === 'name') {
          cmp = String(a.namaSiswa || '').localeCompare(String(b.namaSiswa || ''), undefined, { sensitivity: 'base' });
        } else if (field === 'kelas') {
          cmp = String(a.kelas || '').localeCompare(String(b.kelas || ''), undefined, { numeric: true, sensitivity: 'base' });
          if (cmp === 0) cmp = String(a.namaSiswa || '').localeCompare(String(b.namaSiswa || ''), undefined, { sensitivity: 'base' });
        } else if (field === 'paketId') {
          cmp = String(a.paketId || '').localeCompare(String(b.paketId || ''), undefined, { numeric: true, sensitivity: 'base' });
        } else if (field === 'status') {
          cmp = String(a.status || '').localeCompare(String(b.status || ''), undefined, { sensitivity: 'base' });
        } else if (field === 'percobaanKe') {
          cmp = (Number(a.percobaanKe) || 0) - (Number(b.percobaanKe) || 0);
        } else if (field === 'jumlahBenar') {
          const ra = a.totalSoal > 0 ? (Number(a.jumlahBenar) / Number(a.totalSoal)) : (Number(a.jumlahBenar) || 0);
          const rb = b.totalSoal > 0 ? (Number(b.jumlahBenar) / Number(b.totalSoal)) : (Number(b.jumlahBenar) || 0);
          cmp = ra - rb;
        } else if (field === 'skorAkhir') {
          cmp = (Number(a.skorAkhir) || 0) - (Number(b.skorAkhir) || 0);
        } else if (field === 'durasi') {
          const hasA = a.durasi !== '' && a.durasi !== null && !Number.isNaN(Number(a.durasi));
          const hasB = b.durasi !== '' && b.durasi !== null && !Number.isNaN(Number(b.durasi));
          if (!hasA && !hasB) cmp = 0;
          else if (!hasA) return 1 * dir;
          else if (!hasB) return -1 * dir;
          else cmp = Number(a.durasi) - Number(b.durasi);
        } else if (field === 'pindahTab') {
          cmp = (Number(a.pindahTab) || 0) - (Number(b.pindahTab) || 0);
        } else {
          cmp = getTs(a) - getTs(b);
        }
        if (cmp === 0) cmp = (Number(a.id) || 0) - (Number(b.id) || 0);
        return cmp * dir;
      });
    }
    function updateSortControlsUI() {
      const comboVal = `${dashState.sortField}_${dashState.sortDir}`;
      const dropdown = $('filterSortBy');
      const hasOption = Array.from(dropdown.options).some(opt => opt.value === comboVal);
      if (hasOption) dropdown.value = comboVal;
      document.querySelectorAll('#resultsTable th.sortable-th').forEach(th => {
        const isCurrent = th.dataset.sort === dashState.sortField;
        th.classList.toggle('sort-active', isCurrent);
        const arrow = th.querySelector('.sort-arrow');
        if (arrow) arrow.textContent = isCurrent ? (dashState.sortDir === 'asc' ? '▲' : '▼') : '⇅';
      });
    }

    // =========================================================================
    // FILTER PIPELINE
    // =========================================================================
    function applyFiltersAndRender() {
      const paketFilter = $('filterPaket').value;
      const kelasFilter = $('filterKelas').value;
      const searchFilter = normalizeApostrophes($('filterSearch').value).trim().toLowerCase();
      const statusFilter = $('filterStatus').value;
      const attemptMode = $('filterAttemptMode').value;
      const dummyFilter = $('filterDummyMode').value || 'HIDE';
      dashState.dummyFilter = dummyFilter;

      if (paketFilter && $('missingPaketSelect').value !== paketFilter) {
        $('missingPaketSelect').value = paketFilter;
      }

      let baseRows = dashState.rawRows.filter(r => {
        if (paketFilter && r.paketId !== paketFilter) return false;
        if (kelasFilter && r.kelas !== kelasFilter) return false;
        if (searchFilter && normalizeApostrophes(r.namaSiswa).toLowerCase().indexOf(searchFilter) === -1) return false;
        const isDummy = isDummyRow(r);
        if (dummyFilter === 'HIDE' && isDummy) return false;
        if (dummyFilter === 'ONLY' && !isDummy) return false;
        return true;
      });

      let rows = statusFilter ? baseRows.filter(r => r.status === statusFilter) : baseRows.slice();

      if (attemptMode === 'LATEST') {
        const latestMap = new Map();
        rows.forEach(r => {
          const key = `${r.kelas}|${r.namaSiswa}|${r.paketId}`;
          const existing = latestMap.get(key);
          if (!existing || r.percobaanKe > existing.percobaanKe) latestMap.set(key, r);
        });
        rows = Array.from(latestMap.values());
      }

      const sortedRows = sortResultRows(rows);
      dashState.filteredRows = sortedRows;
      updateSortControlsUI();

      try { updateKpis(sortedRows, paketFilter, kelasFilter, baseRows); } catch (e) { console.error('KPI', e); }
      try { renderPackageGauges(paketFilter, kelasFilter); } catch (e) { console.error('Gauge', e); }
      try { renderClassDonutChart(kelasFilter); } catch (e) { console.error('Donut', e); }
      try { renderPackageBarChart(kelasFilter); } catch (e) { console.error('Bar', e); }
      try { renderResultsTable(sortedRows); } catch (e) { console.error('Results', e); }
      try { renderMissingStudents(); } catch (e) { console.error('Missing', e); }

      const analysisKey = `${paketFilter}|${kelasFilter}|${$('analysisAttemptBasis').value}`;
      if (dashState.lastAnalysisKey !== analysisKey) {
        try { renderItemAnalysis(); dashState.lastAnalysisKey = analysisKey; }
        catch (e) { console.error('Analysis', e); }
      }
    }

    // =========================================================================
    // CHARTS
    // =========================================================================
    function renderPackageGauges(activePaketId, kelasFilter) {
      const container = $('packageGaugesContainer');
      const pkgs = dashState.allPackages || [];
      if (pkgs.length === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-muted);">No packages.</div>';
        return;
      }
      const agg = getPackageAggregates(kelasFilter);
      const arcRadius = 42;
      const arcLength = Math.PI * arcRadius;
      container.innerHTML = pkgs.map((pkg, idx) => {
        const bucket = agg.get(pkg.id) || { studentCount: 0, bestMap: new Map() };
        const sc = bucket.studentCount;
        let avg = 0;
        if (sc > 0) {
          let sum = 0;
          bucket.bestMap.forEach(s => { sum += Number(s.skorAkhir) || 0; });
          avg = Math.round((sum / sc) * 100) / 100;
        }
        const pct = Math.max(0, Math.min(1, avg / 100));
        const dashOffset = (arcLength * (1 - pct)).toFixed(2);
        const color = idx % 2 === 0 ? '#3e5b61' : '#b7ae59';
        const sel = activePaketId === pkg.id;
        const label = sc > 0 ? avg.toFixed(1) : '—';
        return `
          <div class="gauge-item ${sel ? 'active-pkg' : ''}" data-paket-id="${escapeHtml(pkg.id)}" title="Click to filter">
            <div class="gauge-title">${escapeHtml(pkg.name)}</div>
            <svg width="118" height="54" viewBox="0 0 160 72" style="display:block; margin:0 auto;">
              <path d="M 38 56 A 42 42 0 0 1 122 56" fill="none" stroke="#d3dce0" stroke-width="11"/>
              <path d="M 38 56 A 42 42 0 0 1 122 56" fill="none" stroke="${color}" stroke-width="11"
                stroke-dasharray="${arcLength.toFixed(2)}" stroke-dashoffset="${dashOffset}"/>
              <text x="15" y="65" font-size="10" font-weight="700" fill="#626d69" text-anchor="middle">0</text>
              <text x="145" y="65" font-size="10" font-weight="700" fill="#626d69" text-anchor="middle">100</text>
              <text x="80" y="53" font-size="14" font-weight="800" fill="#262e2b" text-anchor="middle">${label}</text>
            </svg>
            <div class="gauge-sub">${escapeHtml(pkg.id)} &bull; ${sc} std</div>
          </div>`;
      }).join('');
    }
    function togglePackageFilterFromGauge(paketId) {
      const sel = $('filterPaket');
      sel.value = (sel.value === paketId) ? '' : paketId;
      if (sel.value) $('missingPaketSelect').value = sel.value;
      applyFiltersAndRender();
    }
    function renderClassDonutChart(kelasFilter) {
      const container = $('classDonutContainer');
      const allClasses = Object.keys(dashState.studentsByClass).sort();
      if (allClasses.length === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-muted); padding:10px 0;">No classes.</div>';
        return;
      }
      const entries = allClasses.map((cls, idx) => ({
        kelas: cls,
        count: (dashState.studentsByClass[cls] || []).length,
        color: EDITORIAL_PALETTE[idx % EDITORIAL_PALETTE.length],
        dimmed: kelasFilter && kelasFilter !== cls
      }));
      const total = entries.reduce((a, e) => a + e.count, 0);
      if (total === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-muted); padding:10px 0;">0 students.</div>';
        return;
      }
      const cx = 85, cy = 85, r = 52;
      const circ = 2 * Math.PI * r;
      let cum = 0;
      const slices = entries.map(e => {
        const len = (e.count / total) * circ;
        const off = -cum;
        cum += len;
        return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${e.color}" stroke-width="26"
          stroke-dasharray="${len.toFixed(2)} ${circ.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"
          opacity="${e.dimmed ? '0.35' : '1'}" transform="rotate(-90 ${cx} ${cy})"/>`;
      }).join('');
      const legend = entries.map(e => `
        <div class="donut-leg-item" style="opacity:${e.dimmed ? '0.5' : '1'};">
          <span style="display:inline-flex; align-items:center; gap:5px; font-weight:700;">
            <i class="legend-swatch" style="background:${e.color};"></i>${escapeHtml(e.kelas)}
          </span>
          <span style="color:var(--text-muted); font-weight:800;">${e.count}</span>
        </div>`).join('');
      container.innerHTML = `
        <div class="donut-flex">
          <svg width="118" height="118" viewBox="0 0 170 170" style="display:block; flex-shrink:0;">
            ${slices}
            <text x="${cx}" y="${cy - 2}" text-anchor="middle" font-size="19" font-weight="800" fill="#262e2b">${total}</text>
            <text x="${cx}" y="${cy + 14}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#626d69">Students</text>
          </svg>
          <div class="donut-legend-list">${legend}</div>
        </div>`;
    }
    function renderPackageBarChart(kelasFilter) {
      const container = $('packageBarChartContainer');
      const pkgs = (dashState.allPackages || []).slice(0, 6);
      if (pkgs.length === 0) {
        container.innerHTML = '<div style="font-size:12px; color:var(--text-muted);">No packages.</div>';
        return;
      }
      const agg = getPackageAggregates(kelasFilter);
      const targetClasses = kelasFilter ? [kelasFilter] : Object.keys(dashState.studentsByClass);
      let rosterCount = 0;
      targetClasses.forEach(c => { rosterCount += (dashState.studentsByClass[c] || []).length; });
      const barsData = pkgs.map(pkg => {
        const b = agg.get(pkg.id) || { passed: 0, remedial: 0, studentCount: 0 };
        return { id: pkg.id, passed: b.passed, remedial: b.remedial, notTaken: Math.max(0, rosterCount - b.studentCount) };
      });
      const maxVal = Math.max(5, rosterCount, ...barsData.flatMap(b => [b.passed, b.remedial, b.notTaken]));
      const svgW = 295, svgH = 122;
      const padL = 26, padR = 6, padT = 8, padB = 22;
      const plotW = svgW - padL - padR, plotH = svgH - padT - padB;
      let grid = '';
      for (let i = 0; i <= 3; i++) {
        const val = Math.round((maxVal / 3) * i);
        const y = padT + plotH - (plotH * (i / 3));
        grid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${svgW - padR}" y2="${y.toFixed(1)}" stroke="#d5d7ce"/>
          <text x="${padL - 4}" y="${(y + 3).toFixed(1)}" font-size="8.5" fill="#626d69" text-anchor="end">${val}</text>`;
      }
      const groupW = plotW / barsData.length;
      const barW = Math.min(9, Math.max(4.5, (groupW - 8) / 3));
      const groups = barsData.map((b, i) => {
        const cx = padL + groupW * i + groupW / 2;
        const hP = (b.passed / maxVal) * plotH;
        const hR = (b.remedial / maxVal) * plotH;
        const hN = (b.notTaken / maxVal) * plotH;
        return `
          <rect x="${(cx - barW * 1.5 - 1).toFixed(1)}" y="${(padT + plotH - hP).toFixed(1)}" width="${barW}" height="${hP.toFixed(1)}" fill="#3e5b61"/>
          <rect x="${(cx - barW * 0.5).toFixed(1)}" y="${(padT + plotH - hR).toFixed(1)}" width="${barW}" height="${hR.toFixed(1)}" fill="#dcd695"/>
          <rect x="${(cx + barW * 0.5 + 1).toFixed(1)}" y="${(padT + plotH - hN).toFixed(1)}" width="${barW}" height="${hN.toFixed(1)}" fill="#d3dce0"/>
          <text x="${cx.toFixed(1)}" y="${svgH - 6}" font-size="9" font-weight="700" fill="#262e2b" text-anchor="middle">${escapeHtml(b.id)}</text>`;
      }).join('');
      container.innerHTML = `<svg width="100%" viewBox="0 0 ${svgW} ${svgH}" style="display:block;">
        ${grid}
        <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#8c9692"/>
        <line x1="${padL}" y1="${padT + plotH}" x2="${svgW - padR}" y2="${padT + plotH}" stroke="#8c9692"/>
        ${groups}
      </svg>`;
    }

    function updateKpis(rows, paketFilter, kelasFilter, baseRows) {
      $('kpiTotalAttemptsSub').textContent = `${rows.length} total attempt(s)`;
      $('kpiKkmInfo').textContent = `Passing Score: ${dashState.kkm}`;

      const targetClasses = kelasFilter ? [kelasFilter] : Object.keys(dashState.studentsByClass);
      let totalRoster = 0;
      targetClasses.forEach(c => { totalRoster += (dashState.studentsByClass[c] || []).length; });
      $('kpiTotalStudentsSub').textContent = `Out of ${totalRoster} registered`;

      const sourceRows = baseRows || rows;
      const studentBest = new Map();
      sourceRows.forEach(r => {
        const key = `${r.kelas}|${r.namaSiswa}`;
        const prev = studentBest.get(key);
        if (!prev || r.skorAkhir > prev.skorAkhir) studentBest.set(key, r);
      });
      const uniqueDone = studentBest.size;
      $('kpiUniqueDone').textContent = uniqueDone;
      if (paketFilter) {
        $('kpiNotDone').textContent = Math.max(0, totalRoster - uniqueDone);
        $('kpiMissingSub').textContent = `Package ${paketFilter}`;
      } else {
        $('kpiNotDone').textContent = '-';
        $('kpiMissingSub').textContent = 'Select package';
      }
      if (uniqueDone > 0) {
        let sum = 0, passed = 0;
        studentBest.forEach(s => {
          sum += Number(s.skorAkhir) || 0;
          if (s.skorAkhir >= dashState.kkm || s.status === 'PASSED') passed++;
        });
        $('kpiAvgScore').textContent = (Math.round((sum / uniqueDone) * 100) / 100).toFixed(2);
        $('kpiPassRate').textContent = Math.round((passed / uniqueDone) * 100) + '%';
      } else {
        $('kpiAvgScore').textContent = '0.00';
        $('kpiPassRate').textContent = '0%';
      }
    }

    // =========================================================================
    // ITEM ANALYSIS
    // =========================================================================
    function getExpectedKeyLetters(q) {
      const t = String(q.tipeSoal || '').toUpperCase();
      const k = normalizeApostrophes(q.kunciJawaban).trim().toUpperCase();
      if (!k) return [];
      if (t === 'BS') {
        if (['A', 'TRUE', 'BENAR', '1', 'T'].indexOf(k) !== -1) return ['A'];
        if (['B', 'FALSE', 'SALAH', '0', 'F'].indexOf(k) !== -1) return ['B'];
        return [];
      }
      if (t === 'PGK') return k.replace(/[^A-E,|;]/g, '').split(/[,|;]/).map(s => s.trim()).filter(Boolean);
      if (t === 'PG' || t === 'MENJODOHKAN') {
        const clean = k.replace(/[^A-E]/g, '');
        return clean ? [clean[0]] : [];
      }
      return [];
    }
    function renderItemAnalysis() {
      const paketId = $('filterPaket').value;
      const kelasFilter = $('filterKelas').value;
      const basis = $('analysisAttemptBasis').value;
      const tbody = $('analysisTableBody');
      const notice = $('analysisNotice');
      const summaryGrid = $('analysisSummaryGrid');
      if (!paketId) {
        dashState.analysisReport = [];
        notice.classList.remove('hidden');
        summaryGrid.classList.add('hidden');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:var(--text-muted); padding:20px;">Select a package.</td></tr>';
        return;
      }
      notice.classList.add('hidden');
      const questions = resolveQuestionPassages(dashState.bankSoal[paketId] || []);
      let pool = dashState.rawRows.filter(r => {
        if (r.paketId !== paketId) return false;
        if (kelasFilter && r.kelas !== kelasFilter) return false;
        if (isDummyRow(r)) return false; // exclude dummy dari analysis
        return true;
      });
      if (basis === 'FIRST') {
        const m = new Map();
        pool.forEach(r => {
          const key = `${r.kelas}|${r.namaSiswa}`;
          const prev = m.get(key);
          if (!prev || r.percobaanKe < prev.percobaanKe) m.set(key, r);
        });
        pool = Array.from(m.values());
      } else if (basis === 'LATEST') {
        const m = new Map();
        pool.forEach(r => {
          const key = `${r.kelas}|${r.namaSiswa}`;
          const prev = m.get(key);
          if (!prev || r.percobaanKe > prev.percobaanKe) m.set(key, r);
        });
        pool = Array.from(m.values());
      }
      if (questions.length === 0) {
        dashState.analysisReport = [];
        summaryGrid.classList.add('hidden');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:var(--text-muted); padding:20px;">No questions.</td></tr>';
        return;
      }
      const sortedPool = pool.slice().sort((a, b) => (b.skorMentah - a.skorMentah) || (b.jumlahBenar - a.jumlahBenar));
      const nTotal = sortedPool.length;
      const canCalcD = nTotal >= 4;
      const groupSize = canCalcD ? Math.min(Math.floor(nTotal / 2), Math.max(1, Math.round(nTotal * 0.27))) : 0;
      const upperIds = new Set(sortedPool.slice(0, groupSize).map(r => r.id));
      const lowerIds = new Set(sortedPool.slice(nTotal - groupSize).map(r => r.id));
      const detailIndex = new Map();
      pool.forEach(r => {
        (r.details || []).forEach(d => detailIndex.set(`${r.id}|${String(d.noSoal)}`, d));
      });
      let countLayak = 0, countRevisi = 0, countKunci = 0;
      const report = [];
      questions.forEach((q, idx) => {
        const qNo = String(q.noSoal || (idx + 1));
        const t = String(q.tipeSoal || 'PG').toUpperCase();
        const keyLetters = getExpectedKeyLetters(q);
        let totalScore = 0, count = 0, upSum = 0, upN = 0, lowSum = 0, lowN = 0;
        const optionCounts = { A: 0, B: 0, C: 0, D: 0, E: 0, KOSONG: 0 };
        const shortMap = new Map();
        const matrixStats = { penuh: 0, parsial: 0, salah: 0 };
        pool.forEach(r => {
          const det = detailIndex.get(`${r.id}|${qNo}`);
          if (!det || typeof det.score !== 'number') return;
          totalScore += det.score; count++;
          if (canCalcD) {
            if (upperIds.has(r.id)) { upSum += det.score; upN++; }
            if (lowerIds.has(r.id)) { lowSum += det.score; lowN++; }
          }
          if (t === 'IS') {
            const raw = normalizeApostrophes(det.studentAns).trim() || '(Unanswered)';
            const key = raw.toLowerCase();
            const cur = shortMap.get(key) || { text: raw, count: 0, correct: det.score >= 1 };
            cur.count++;
            if (det.score >= 1) cur.correct = true;
            shortMap.set(key, cur);
          } else if (t === 'MATRIKS') {
            if (det.score >= 1) matrixStats.penuh++;
            else if (det.score > 0) matrixStats.parsial++;
            else matrixStats.salah++;
          } else {
            const picked = Array.isArray(det.picked) ? det.picked : [];
            if (picked.length === 0) optionCounts.KOSONG++;
            else picked.forEach(o => { if (o in optionCounts) optionCounts[o]++; });
          }
        });
        const pPct = count > 0 ? Math.round((totalScore / count) * 100) : 0;
        let diffLabel = 'No Data';
        if (count > 0) {
          if (pPct >= 70) diffLabel = 'Easy';
          else if (pPct >= 30) diffLabel = 'Moderate';
          else diffLabel = 'Difficult';
        }
        let dVal = null, dLabel = 'N < 4';
        if (canCalcD && upN > 0 && lowN > 0) {
          dVal = Math.round(((upSum / upN) - (lowSum / lowN)) * 100) / 100;
          if (dVal >= 0.40) dLabel = 'Excellent';
          else if (dVal >= 0.30) dLabel = 'Good';
          else if (dVal >= 0.20) dLabel = 'Fair';
          else if (dVal >= 0) dLabel = 'Poor';
          else dLabel = 'Negative!';
        }
        let hasDead = false, hasDominant = false;
        const activeLetters = t === 'BS' ? ['A', 'B']
          : ((optionCounts.E > 0 || keyLetters.indexOf('E') !== -1 || (q.options && q.options.E && q.options.E !== '-'))
            ? ['A', 'B', 'C', 'D', 'E'] : ['A', 'B', 'C', 'D']);
        const allKey = keyLetters.length >= activeLetters.length;
        if (count > 0 && ['PG', 'PGK', 'BS', 'MENJODOHKAN'].indexOf(t) !== -1) {
          const minKey = keyLetters.length > 0 ? Math.min.apply(null, keyLetters.map(k => optionCounts[k] || 0)) : 0;
          activeLetters.forEach(l => {
            if (keyLetters.indexOf(l) === -1) {
              const pct = (optionCounts[l] / count) * 100;
              if (count >= 5 && pct < 5) hasDead = true;
              if (!allKey && t !== 'PGK' && keyLetters.length > 0 && optionCounts[l] > minKey) hasDominant = true;
            }
          });
        }
        let statusCode = 'EMPTY', statusText = 'No Data', badgeCls = 'badge-neutral';
        let note = 'No answers.';
        if (count > 0) {
          if ((dVal !== null && dVal < 0) || hasDominant) {
            statusCode = 'CHECK_KEY'; statusText = 'Check Key'; badgeCls = 'badge-remedial'; countKunci++;
            note = dVal !== null && dVal < 0
              ? `Negative discrimination (D = ${dVal.toFixed(2)}). Verify answer key.`
              : 'A distractor chosen more than key.';
          } else if ((pPct > 85 || pPct < 20) && (dVal === null || dVal >= 0.20)) {
            statusCode = 'REV_DIFF'; statusText = 'Revise Diff.'; badgeCls = 'badge-warn'; countRevisi++;
            note = pPct > 85 ? `Too easy (${pPct}%).` : `Too difficult (${pPct}%).`;
          } else if ((dVal !== null && dVal < 0.20) || hasDead) {
            statusCode = 'REV_DIST'; statusText = 'Revise Dist.'; badgeCls = 'badge-warn'; countRevisi++;
            note = (dVal !== null && dVal < 0.20)
              ? `Low discrimination (D = ${dVal.toFixed(2)}).`
              : 'Dead distractor (<5%).';
          } else {
            statusCode = 'GOOD'; statusText = 'Good to Keep'; badgeCls = 'badge-passed'; countLayak++;
            note = 'Well balanced.';
          }
        }
        report.push({
          idx, qNo, tipeSoal: t, kunciJawaban: q.kunciJawaban,
          rawPertanyaan: q.pertanyaan, pertanyaan: stripMediaTags(q.pertanyaan),
          passage: q._passage || '', options: q.options || {},
          pembahasan: q.pembahasan || '', sheetRow: q.sheetRow || '',
          count, pPct, diffLabel, dVal, dLabel, statusCode, statusText, badgeCls, note,
          keyLetters, activeLetters, optionCounts,
          shortAnswers: Array.from(shortMap.values()).sort((a, b) => b.count - a.count),
          matrixStats
        });
      });
      dashState.analysisReport = report;
      summaryGrid.classList.remove('hidden');
      $('sumLayakCount').textContent = `${countLayak} Qs`;
      $('sumRevisiCount').textContent = `${countRevisi} Qs`;
      $('sumKunciCount').textContent = `${countKunci} Qs`;
      tbody.innerHTML = report.map(item => {
        const dDisplay = item.dVal === null
          ? `<span style="color:var(--text-muted); font-size:11.5px;">${item.dLabel}</span>`
          : `<strong style="color:${item.dVal < 0 ? 'var(--danger)' : (item.dVal >= 0.3 ? 'var(--success)' : 'var(--text-main)')};">${item.dVal.toFixed(2)}</strong> <span style="font-size:10.5px; color:var(--text-muted);">(${item.dLabel})</span>`;
        return `
          <tr>
            <td><strong>${escapeHtml(item.qNo)}</strong></td>
            <td style="white-space:nowrap;">
              <span class="badge badge-neutral">${escapeHtml(item.tipeSoal)}</span>
              <span style="font-size:11px; margin-left:4px;">Key: <strong>${escapeHtml(item.kunciJawaban)}</strong></span>
            </td>
            <td class="q-snippet-cell">${escapeHtml(item.pertanyaan.substring(0, 90))}</td>
            <td>${item.count}</td>
            <td style="white-space:nowrap;">
              <div class="diff-bar"><div class="diff-fill" style="width:${item.pPct}%;"></div></div>
              <strong>${item.pPct}%</strong> <span style="font-size:10.5px; color:var(--text-muted);">(${item.diffLabel})</span>
            </td>
            <td style="white-space:nowrap;">${dDisplay}</td>
            <td><span class="badge ${item.badgeCls}">${item.statusText}</span></td>
            <td class="action-cell">
              <div style="display:flex; gap:4px; flex-wrap:nowrap;">
                <button type="button" class="btn btn-primary btn-xs" data-preview-idx="${item.idx}">Preview</button>
                <button type="button" class="btn btn-outline btn-xs" data-detail-idx="${item.idx}">Dist.</button>
              </div>
            </td>
          </tr>
          <tr id="analysis-detail-${item.idx}" class="detail-drawer-row hidden">
            <td colspan="8">${buildDistractorDetailHtml(item)}</td>
          </tr>`;
      }).join('');
      tbody.querySelectorAll('button[data-preview-idx]').forEach(btn => {
        btn.addEventListener('click', () => openItemPreviewModal(Number(btn.dataset.previewIdx)));
      });
      tbody.querySelectorAll('button[data-detail-idx]').forEach(btn => {
        btn.addEventListener('click', () => toggleAnalysisDetail(Number(btn.dataset.detailIdx)));
      });
    }
    function buildDistractorDetailHtml(item) {
      if (item.count === 0) return `<div style="font-size:12.5px; color:var(--text-muted);">${escapeHtml(item.note)}</div>`;
      let body = '';
      if (item.tipeSoal === 'IS') {
        const top = item.shortAnswers.slice(0, 10).map(sa => {
          const pct = Math.round((sa.count / item.count) * 100);
          const tag = sa.correct ? '<span class="badge badge-passed">Correct</span>' : '<span class="badge badge-remedial">Wrong</span>';
          return `<div class="dist-box ${sa.correct ? 'is-key' : ''}">
            <div style="display:flex; justify-content:space-between; gap:6px; align-items:center;">
              <strong>"${escapeHtml(sa.text)}"</strong>${tag}
            </div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">${sa.count} (${pct}%)</div>
          </div>`;
        }).join('');
        body = `<div style="font-size:12px; font-weight:700; margin-top:6px;">Top Answers:</div><div class="distractor-grid">${top}</div>`;
      } else if (item.tipeSoal === 'MATRIKS') {
        const m = item.matrixStats;
        body = `<div class="distractor-grid">
          <div class="dist-box is-key"><strong>Full</strong><div>${m.penuh} (${Math.round(m.penuh / item.count * 100)}%)</div></div>
          <div class="dist-box"><strong>Partial</strong><div>${m.parsial} (${Math.round(m.parsial / item.count * 100)}%)</div></div>
          <div class="dist-box is-danger"><strong>Zero</strong><div>${m.salah} (${Math.round(m.salah / item.count * 100)}%)</div></div>
        </div>`;
      } else {
        const minKey = item.keyLetters.length > 0 ? Math.min.apply(null, item.keyLetters.map(k => item.optionCounts[k] || 0)) : 0;
        const cards = item.activeLetters.map(l => {
          const cnt = item.optionCounts[l] || 0;
          const pct = Math.round((cnt / item.count) * 100);
          const isKey = item.keyLetters.indexOf(l) !== -1;
          const isDom = !isKey && item.tipeSoal !== 'PGK' && item.keyLetters.length > 0 && cnt > minKey;
          const isDead = !isKey && item.count >= 5 && pct < 5;
          let sub = isKey ? 'Answer Key' : 'Distractor';
          if (isDom) sub = 'Chosen More Than Key!';
          else if (isDead) sub = 'Weak Distractor (<5%)';
          return `<div class="dist-box ${isKey ? 'is-key' : (isDom ? 'is-danger' : '')}">
            <div style="display:flex; justify-content:space-between; font-size:12px;">
              <strong>Option ${l} ${isKey ? '✓' : ''}</strong><span><strong>${cnt}</strong> (${pct}%)</span>
            </div>
            <div class="dist-bar-track"><div class="dist-bar-fill" style="width:${pct}%;"></div></div>
            <div style="font-size:10.5px; color:${isDom ? 'var(--danger)' : 'var(--text-muted)'}; font-weight:600;">${sub}</div>
          </div>`;
        }).join('');
        const kp = Math.round((item.optionCounts.KOSONG / item.count) * 100);
        const kc = item.optionCounts.KOSONG > 0
          ? `<div class="dist-box"><div style="display:flex; justify-content:space-between; font-size:12px;"><strong>Unanswered</strong><span><strong>${item.optionCounts.KOSONG}</strong> (${kp}%)</span></div><div class="dist-bar-track"><div class="dist-bar-fill" style="width:${kp}%;"></div></div></div>`
          : '';
        body = `<div class="distractor-grid">${cards}${kc}</div>`;
      }
      return `<div style="font-size:12px; margin-bottom:6px;"><strong>Note:</strong> ${escapeHtml(item.note)}</div>${body}`;
    }
    function toggleAnalysisDetail(idx) {
      const row = $(`analysis-detail-${idx}`);
      if (row) row.classList.toggle('hidden');
    }
    function pauseItemPreviewAudio() {
      document.querySelectorAll('#itemPreviewBody audio').forEach(a => { try { a.pause(); } catch (e) {} });
    }
    function openItemPreviewModal(idx) {
      const report = dashState.analysisReport || [];
      if (idx < 0 || idx >= report.length) return;
      dashState.currentPreviewItemIdx = idx;
      pauseItemPreviewAudio();
      const item = report[idx];
      const paketId = $('filterPaket').value || '';
      const typeLabel = TYPE_LABELS[item.tipeSoal] || item.tipeSoal;
      $('itemPreviewTitle').textContent = `Q${item.qNo} Preview (${typeLabel})`;
      $('itemPreviewMeta').textContent = `Package: ${getPackageName(paketId)} (${paketId}) • Row: ${item.sheetRow || '-'} • Students: ${item.count}`;
      const passageHtml = item.passage
        ? `<div class="passage-preview-box"><div style="font-size:10.5px; font-weight:800; color:var(--teal-dark); text-transform:uppercase; margin-bottom:5px;">Passage</div><div>${formatRichMedia(item.passage)}</div></div>`
        : '';
      let stemHtml = '';
      if (item.tipeSoal === 'MATRIKS') {
        let raw = String(item.rawPertanyaan || '');
        let headers = [];
        const hm = raw.match(/\[(?:HEADER:\s*)?([^\]]+)\]/i);
        if (hm) {
          headers = hm[1].split('|').map(s => s.trim()).filter(Boolean);
          raw = raw.replace(hm[0], '').trim();
        }
        const parts = raw.split(/[\|\n]/).map(s => s.trim()).filter(Boolean);
        const prompt = parts.length > 1 ? parts[0] : 'Matrix Question';
        const stmts = parts.length > 1 ? parts.slice(1) : parts;
        const filled = ['A', 'B', 'C', 'D', 'E'].filter(l => {
          const v = String((item.options && item.options[l]) || '').trim();
          return v !== '' && v !== '-';
        });
        const colLabels = filled.length > 0 ? filled.map(l => item.options[l].trim())
          : (headers.length > 1 ? headers.slice(1) : ['True', 'False']);
        const letters = colLabels.map((_, i) => String.fromCharCode(65 + i));
        const firstCol = headers.length > 0 ? headers[0] : 'Statement';
        const keySeq = String(item.kunciJawaban || '').replace(/[^A-E,|;]/gi, '').split(/[,|;]/).map(s => s.trim().toUpperCase()).filter(Boolean);
        stemHtml = `
          <div class="stem-preview-box" style="font-size:14px; font-weight:700; margin-bottom:10px; white-space:pre-line;">${formatRichMedia(prompt)}</div>
          <div class="table-wrap" style="margin-bottom:10px;">
            <table>
              <thead><tr><th>${escapeHtml(firstCol)}</th>${colLabels.map(l => `<th style="text-align:center;">${formatRichMedia(l)}</th>`).join('')}</tr></thead>
              <tbody>${stmts.map((s, ri) => `
                <tr>
                  <td>${formatRichMedia(s)}</td>
                  ${letters.map(l => {
                    const isKey = keySeq[ri] === l;
                    return `<td style="text-align:center; ${isKey ? 'background:var(--success-soft); color:var(--success); font-weight:800;' : ''}">${isKey ? '✓ Key' : '—'}</td>`;
                  }).join('')}
                </tr>`).join('')}</tbody>
            </table>
          </div>`;
      } else if (item.tipeSoal === 'IS') {
        const accepted = String(item.kunciJawaban || '').split('|').map(s => s.trim()).filter(Boolean);
        stemHtml = `
          <div class="stem-preview-box" style="font-size:14px; font-weight:700; margin-bottom:10px; white-space:pre-line;">${formatRichMedia(item.rawPertanyaan)}</div>
          <div class="opt-pill is-key">Accepted: ${escapeHtml(accepted.join(' | '))}</div>`;
      } else {
        const letters = item.tipeSoal === 'BS' ? ['A', 'B'] : ['A', 'B', 'C', 'D', 'E'];
        const opts = Object.assign({}, item.options || {});
        if (item.tipeSoal === 'BS') {
          if (!opts.A || opts.A === '-') opts.A = 'True';
          if (!opts.B || opts.B === '-') opts.B = 'False';
        }
        const optHtml = letters.map(l => {
          const v = String(opts[l] || '').trim();
          if (!v || v === '-') return '';
          const isKey = item.keyLetters.indexOf(l) !== -1;
          const cnt = item.optionCounts[l] || 0;
          const pct = item.count > 0 ? Math.round((cnt / item.count) * 100) : 0;
          return `<div class="opt-pill ${isKey ? 'is-key' : ''}">
            <div class="opt-pill-main"><span class="opt-letter-tag">${l}</span><div>${formatRichMedia(v)}</div></div>
            <div style="display:flex; align-items:center; gap:5px; flex-shrink:0;">
              ${isKey ? '<span class="opt-key-pill">✓ KEY</span>' : ''}
              <span style="font-size:11px; opacity:0.85;">${cnt} (${pct}%)</span>
            </div>
          </div>`;
        }).join('');
        stemHtml = `
          <div class="stem-preview-box" style="font-size:14px; font-weight:700; margin-bottom:10px; white-space:pre-line;">${formatRichMedia(item.rawPertanyaan)}</div>
          <div class="preview-opts-grid">${optHtml}</div>`;
      }
      const expHtml = item.pembahasan
        ? `<div class="preview-explanation" style="margin-top:10px;"><strong>Explanation:</strong><br>${formatRichMedia(item.pembahasan)}</div>`
        : '';
      const dText = item.dVal === null ? item.dLabel : `${item.dVal.toFixed(2)} (${item.dLabel})`;
      const navHtml = `
        <div style="margin-top:12px; padding:10px 12px; background:var(--bg-cream); border:1px solid var(--border-line); display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:8px;">
          <div style="font-size:11.5px;">
            <strong>P:</strong> ${item.pPct}% (${item.diffLabel}) &nbsp;|&nbsp;
            <strong>D:</strong> ${dText} &nbsp;|&nbsp;
            <span class="badge ${item.badgeCls}">${item.statusText}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button type="button" class="btn btn-outline btn-xs" ${idx === 0 ? 'disabled' : ''} onclick="openItemPreviewModal(${idx - 1})">&larr; Prev</button>
            <button type="button" class="btn btn-outline btn-xs" ${idx >= report.length - 1 ? 'disabled' : ''} onclick="openItemPreviewModal(${idx + 1})">Next &rarr;</button>
          </div>
        </div>`;
      $('itemPreviewBody').innerHTML = passageHtml + stemHtml + expHtml + navHtml;
      $('itemPreviewModal').classList.remove('hidden');
    }

    function exportResultsCsv() {
      const rows = dashState.filteredRows || [];
      if (rows.length === 0) { showToast('No results to export.'); return; }
      const headers = ['Name', 'Class', 'Package', 'Attempt', 'Correct', 'Total', 'Score', 'Status', 'Duration', 'TabSwitches', 'Timestamp', 'IsDummy'];
      const csvRows = rows.map(r => [
        r.namaSiswa, r.kelas, r.paketId, r.percobaanKe, r.jumlahBenar, r.totalSoal,
        r.skorAkhir, r.status, r.durasi, r.pindahTab, r.timestamp, isDummyRow(r) ? 'YES' : 'NO'
      ]);
      downloadCsv([headers, ...csvRows], `results_${new Date().toISOString().slice(0, 10)}.csv`);
    }
    function exportAnalysisCsv() {
      const list = dashState.analysisReport || [];
      if (list.length === 0) { showToast('Select package first.'); return; }
      const paketId = $('filterPaket').value || 'package';
      const headers = ['Question_No', 'Type', 'Answer_Key', 'Question_Text', 'Students_Count',
        'Difficulty_P_Pct', 'Difficulty_Level', 'Discrimination_D', 'Discrimination_Level', 'Status', 'Note'];
      const rows = list.map(it => [
        it.qNo, it.tipeSoal, it.kunciJawaban, it.pertanyaan.replace(/"/g, '""'),
        it.count, it.pPct, it.diffLabel, it.dVal === null ? '' : it.dVal, it.dLabel, it.statusText, it.note.replace(/"/g, '""')
      ]);
      downloadCsv([headers, ...rows], `item_analysis_${paketId}_${new Date().toISOString().slice(0, 10)}.csv`);
    }
    function downloadCsv(rows, filename) {
      const csv = rows.map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      showToast('CSV downloaded.');
    }

    async function renderPackagesTab() {
      const tbody = $('packagesTableBody');
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:20px;">Loading packages...</td></tr>';
      try {
        const res = await callApi('getPaketManagementData', dashState.token);
        dashState.packageManagement = res.packages || [];
        if (dashState.packageManagement.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:var(--text-muted); padding:20px;">No packages.</td></tr>';
          return;
        }
        tbody.innerHTML = dashState.packageManagement.map(pkg => {
          const isActive = pkg.status === 'ACTIVE';
          const statusBadge = isActive ? '<span class="badge badge-passed">ACTIVE</span>' : '<span class="badge badge-neutral">INACTIVE</span>';
          return `<tr>
            <td><strong>${escapeHtml(pkg.id)}</strong></td>
            <td>${escapeHtml(pkg.name)}</td>
            <td>${pkg.jumlahSoal}</td>
            <td>${pkg.jumlahPengerjaan}</td>
            <td>${statusBadge}</td>
            <td class="action-cell">
              <div style="display:flex; gap:4px; flex-wrap:nowrap;">
                <button type="button" class="btn btn-outline btn-xs" data-action="preview" data-paket="${escapeHtml(pkg.id)}">Preview</button>
                <button type="button" class="btn ${isActive ? 'btn-danger-soft' : 'btn-success'} btn-xs" data-action="toggle" data-paket="${escapeHtml(pkg.id)}" data-status="${isActive ? 'INACTIVE' : 'ACTIVE'}">
                  ${isActive ? 'Deactivate' : 'Activate'}
                </button>
              </div>
            </td>
          </tr>`;
        }).join('');
        tbody.querySelectorAll('button[data-action]').forEach(btn => {
          btn.addEventListener('click', () => {
            const action = btn.dataset.action;

        });

        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--danger); padding:20px;">${escapeHtml(err.message)}</td></tr>`;

    async function togglePackageStatus(paketId, newStatus) {
      if (!confirm(`Change ${paketId} to ${newStatus}?`)) return;
      showLoading('Updating...');
      try {
        const res = await callApi('togglePaketStatus', dashState.token, paketId, newStatus);
        showToast(res.message || 'Updated.');
        await renderPackagesTab();
        const dashRes = await callApi('getDashboardData', dashState.token, { sinceDays: Number($('filterDays').value) || 0 });
        dashState.allPackages = dashRes.allPackages || [];
        dashState.aggCacheKey = '';
        populateFilterDropdowns();
      } catch (err) { showToast(err.message); }
      finally { hideLoading(); }
    }
    async function openPackagePreview(paketId, forceFresh) {
      const reqId = ++dashState.previewReqId;
      dashState.currentPreviewPaketId = paketId;
      $('previewPanel').classList.remove('hidden');
      $('previewTitle').textContent = `Loading ${paketId}...`;
      $('previewStatsBadges').innerHTML = '';
      $('previewJumpBar').classList.add('hidden');
      $('previewQuestionsList').innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Loading questions...</div>';
      try {
        const res = await callApi('getPaketPreview', dashState.token, paketId, Boolean(forceFresh));
        if (reqId !== dashState.previewReqId) return;
        dashState.previewData = res;
        renderPackagePreview(res);
      } catch (err) {
        if (reqId !== dashState.previewReqId) return;
        $('previewQuestionsList').innerHTML = `<div class="alert-error">${escapeHtml(err.message)}</div>`;
      }
    }
    function renderPackagePreview(data) {
      const pkg = data.paket || {};
      const questions = data.questions || [];
      $('previewTitle').textContent = `${pkg.name || pkg.id} (${pkg.id})`;
      const issueCount = questions.filter(q => (q.issues || []).length > 0).length;
      const badges = [`<span class="badge badge-neutral">${questions.length} Qs</span>`,
        pkg.status === 'ACTIVE' ? '<span class="badge badge-passed">ACTIVE</span>' : '<span class="badge badge-neutral">INACTIVE</span>'];
      if (issueCount > 0) badges.push(`<span class="badge badge-remedial">${issueCount} with issues</span>`);
      $('previewStatsBadges').innerHTML = badges.join('');
      const jumpBar = $('previewJumpBar');
      if (questions.length > 0) {
        jumpBar.classList.remove('hidden');
        jumpBar.innerHTML = questions.map((q, i) => {
          const has = (q.issues || []).length > 0;
          return `<button type="button" class="jump-pill ${has ? 'has-issue' : ''}" data-idx="${i}" title="${has ? escapeHtml(q.issues.join(' | ')) : 'OK'}">${escapeHtml(q.noSoal || (i + 1))}</button>`;
        }).join('');
        jumpBar.querySelectorAll('.jump-pill').forEach(btn => {
          btn.addEventListener('click', () => {
            const el = $(`preview-q-${btn.dataset.idx}`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          });
        });
      } else jumpBar.classList.add('hidden');
      const visible = dashState.previewFilterIssuesOnly ? questions.filter(q => (q.issues || []).length > 0) : questions;
      if (visible.length === 0) {
        $('previewQuestionsList').innerHTML = `<div style="text-align:center; padding:20px; color:var(--text-muted);">${dashState.previewFilterIssuesOnly ? 'No issues. 🎉' : 'No questions.'}</div>`;
        return;
      }
      $('previewQuestionsList').innerHTML = visible.map(q => renderPreviewQuestionCard(q, questions.indexOf(q))).join('');
    }
    function renderPreviewQuestionCard(q, idx) {
      const t = String(q.tipeSoal || 'PG').toUpperCase();
      const issues = q.issues || [];
      const has = issues.length > 0;
      const keyLetters = (q.key && q.key.letters) || [];
      const accepted = (q.key && q.key.accepted) || [];
      let optHtml = '';
      if (t === 'IS') {
        optHtml = accepted.length > 0
          ? `<div class="opt-pill is-key"><strong>Accepted:</strong> ${escapeHtml(accepted.join(' | '))}</div>`
          : '<div class="opt-pill" style="color:var(--danger);">No accepted answers.</div>';
      } else if (t === 'MATRIKS') {
        optHtml = '<div class="opt-pill"><em>Matrix — key sequence:</em> ' + escapeHtml(keyLetters.join(', ')) + '</div>';
      } else {
        const letters = ['A', 'B', 'C', 'D', 'E'].filter(l => q.options && q.options[l] && q.options[l] !== '-');
        optHtml = letters.map(l => {
          const isKey = keyLetters.indexOf(l) !== -1;
          return `<div class="opt-pill ${isKey ? 'is-key' : ''}">
            <div class="opt-pill-main"><span class="opt-letter-tag">${l}</span><div>${formatRichMedia(q.options[l])}</div></div>
            ${isKey ? '<span class="opt-key-pill">✓ KEY</span>' : ''}
          </div>`;
        }).join('');
      }
      const passHtml = q.teksBacaan && q.teksBacaan !== '-' && q.teksBacaan.trim() !== ''
        ? `<div class="passage-group-card"><div class="passage-group-head"><span class="badge badge-teal">PASSAGE</span></div><div class="passage-group-body">${formatRichMedia(q.teksBacaan)}</div></div>`
        : '';
      const expHtml = dashState.previewShowExplanations && q.pembahasan
        ? `<div class="preview-explanation"><strong>Explanation:</strong> ${formatRichMedia(q.pembahasan)}</div>` : '';
      const issueHtml = has ? `<div class="preview-issue-bar">⚠ ${issues.map(escapeHtml).join(' • ')}</div>` : '';
      return `<div class="preview-q ${has ? 'has-issue' : ''}" id="preview-q-${idx}">
        <div class="preview-q-head"><div style="display:flex; align-items:center; gap:6px;">
          <span class="preview-q-num">Q${escapeHtml(q.noSoal || (idx + 1))}</span>
          <span class="badge badge-neutral">${escapeHtml(t)}</span>
          <span style="font-size:11px; color:var(--text-muted);">Row ${q.sheetRow || '-'}</span>
        </div></div>
        ${passHtml}
        <div class="preview-q-stem">${formatRichMedia(q.pertanyaan)}</div>
        <div class="preview-opts-grid">${optHtml}</div>
        ${expHtml}${issueHtml}
      </div>`;
    }

    // =========================================================================
    // SETTINGS
    // =========================================================================
    function syncSecurityUI() {
      const sec = dashState.security || {};
      $('settingStudentPin').value = (String(sec.requireStudentPin).toUpperCase() === 'YES') ? 'YES' : 'NO';
      $('settingTeacherPin').value = (String(sec.requireTeacherPin).toUpperCase() === 'NO') ? 'NO' : 'YES';
      const hidden = (String(sec.showKey).toUpperCase() === 'HIDE');
      $('settingHideAnswerKey').checked = hidden;
      $('hideKeyStatusText').textContent = hidden
        ? 'Active (ON) — Answer keys & explanations are HIDDEN from students.'
        : 'Inactive (OFF) — Answer keys & explanations are VISIBLE to students.';
      const vp = Number(sec.validPinCount) || 0;
      const tp = Number(sec.totalStudentCount) || 0;
      $('pinCoverageBadge').textContent = tp > 0
        ? `${vp} / ${tp} student(s) have valid birth-date PINs.`
        : 'No student data.';
    }
    async function handleSaveSecurity() {
      const reqStudent = $('settingStudentPin').value;
      const reqTeacher = $('settingTeacherPin').value;
      const showKey = $('settingHideAnswerKey').checked ? 'HIDE' : 'SHOW';
      showLoading('Saving...');
      try {
        const res = await callApi('updateSecuritySettings', dashState.token, reqStudent, reqTeacher, showKey);
        if (res.settings) {
          dashState.security.requireStudentPin = res.settings.REQUIRE_STUDENT_PIN;
          dashState.security.requireTeacherPin = res.settings.REQUIRE_TEACHER_PIN;
          dashState.security.showKey = res.settings.SHOW_KEY;
        }
        if (res.pinCoverage) {
          dashState.security.validPinCount = res.pinCoverage.valid;
          dashState.security.totalStudentCount = res.pinCoverage.total;
        }
        syncSecurityUI();
        showToast('Settings saved.');
      } catch (err) { showToast(err.message); }
      finally { hideLoading(); }
    }
    async function handleRunValidation() {
      showLoading('Validating...');
      try {
        const res = await callApi('getBankValidation', dashState.token);
        const issues = res.issues || [];
        const container = $('validationResultList');
        if (issues.length === 0) {
          container.innerHTML = '<div style="color:var(--success); font-weight:700;">✓ No issues. Clean.</div>';
        } else {
          container.innerHTML = `<div style="color:var(--danger); font-weight:800; margin-bottom:6px;">${issues.length} issue(s):</div>
            <ul style="padding-left:18px; font-size:11.5px; line-height:1.55;">${issues.map(m => `<li>${escapeHtml(m)}</li>`).join('')}</ul>`;
        }
      } catch (err) {
        $('validationResultList').innerHTML = `<div class="alert-error">${escapeHtml(err.message)}</div>`;
      } finally { hideLoading(); }
    }

    // =========================================================================
    // TABS
    // =========================================================================
    function switchTab(tabName) {
      dashState.activeTab = tabName;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
      const target = $(`tab-${tabName}`);
      if (target) target.classList.remove('hidden');
      if (tabName === 'packages') renderPackagesTab();
      if (tabName === 'active') refreshActiveSessionsOnly();
      if (tabName === 'analysis') renderItemAnalysis();
      if (tabName === 'settings') syncSecurityUI();
    }

    // =========================================================================
    // EVENTS
    // =========================================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => switchTab(btn.dataset.tab));
    });
    document.querySelectorAll('#resultsTable th.sortable-th').forEach(th => {
      th.addEventListener('click', () => {
        const field = th.dataset.sort;
        if (dashState.sortField === field) dashState.sortDir = dashState.sortDir === 'asc' ? 'desc' : 'asc';
        else { dashState.sortField = field; dashState.sortDir = 'desc'; }
        applyFiltersAndRender();
      });
    });
    $('loginForm').addEventListener('submit', handleLoginSubmit);
    $('btnLogout').addEventListener('click', handleLogout);
    $('btnRefresh').addEventListener('click', loadAllDashboardData);
    $('btnToggleCharts').addEventListener('click', () => {
      const hidden = $('chartsRowSection').classList.toggle('hidden');
      $('btnToggleCharts').textContent = hidden ? 'Show Charts' : 'Hide Charts';
      safeSetStorage('neng_eva_hide_charts', hidden ? '1' : '0');
    });
    $('btnExportCsv').addEventListener('click', exportResultsCsv);
    $('btnExportAnalysisCsv').addEventListener('click', exportAnalysisCsv);
    $('filterPaket').addEventListener('change', applyFiltersAndRender);
    $('filterKelas').addEventListener('change', applyFiltersAndRender);
    $('filterDays').addEventListener('change', loadAllDashboardData);
    $('filterStatus').addEventListener('change', applyFiltersAndRender);
    $('filterAttemptMode').addEventListener('change', applyFiltersAndRender);
    $('filterDummyMode').addEventListener('change', applyFiltersAndRender);
    $('filterSortBy').addEventListener('change', () => {
      const val = $('filterSortBy').value || 'timestamp_desc';
      const parts = val.split('_');
      dashState.sortDir = parts.pop() || 'desc';
      dashState.sortField = parts.join('_') || 'timestamp';
      applyFiltersAndRender();
    });
    $('filterSearch').addEventListener('input', () => {
      clearTimeout(dashState.searchDebounce);
      dashState.searchDebounce = setTimeout(applyFiltersAndRender, 180);
    });
    $('missingPaketSelect').addEventListener('change', renderMissingStudents);
    $('btnCopyMissing').addEventListener('click', copyMissingToClipboard);
    $('activeSessionFilter').addEventListener('change', () => renderActiveSessions(dashState.activeSessions));
    $('btnRefreshActive').addEventListener('click', refreshActiveSessionsOnly);
    $('btnClearExpiredSessions').addEventListener('click', handleClearExpiredSessions);
    $('analysisAttemptBasis').addEventListener('change', () => {
      dashState.lastAnalysisKey = '';
      renderItemAnalysis();
    });
    $('btnCloseDetailModal').addEventListener('click', () => {
      dashState.detailRequestId++;
      $('detailModal').classList.add('hidden');
    });
    $('btnCloseItemPreviewModal').addEventListener('click', () => {
      pauseItemPreviewAudio();
      $('itemPreviewModal').classList.add('hidden');
    });
    $('btnSaveSecurity').addEventListener('click', handleSaveSecurity);
    $('btnRunValidation').addEventListener('click', handleRunValidation);
    $('btnReloadPackages').addEventListener('click', renderPackagesTab);
    $('btnTogglePreviewIssues').addEventListener('click', () => {
      dashState.previewFilterIssuesOnly = !dashState.previewFilterIssuesOnly;
      $('btnTogglePreviewIssues').classList.toggle('active-toggle', dashState.previewFilterIssuesOnly);
      if (dashState.previewData) renderPackagePreview(dashState.previewData);
    });
    $('btnToggleAllExplanations').addEventListener('click', () => {
      dashState.previewShowExplanations = !dashState.previewShowExplanations;
      $('btnToggleAllExplanations').classList.toggle('active-toggle', dashState.previewShowExplanations);
      if (dashState.previewData) renderPackagePreview(dashState.previewData);
    });
    $('btnRefreshPreview').addEventListener('click', () => {
      if (dashState.currentPreviewPaketId) openPackagePreview(dashState.currentPreviewPaketId, true);
    });
    $('btnClosePreview').addEventListener('click', () => {
      $('previewPanel').classList.add('hidden');
      dashState.previewData = null;
      dashState.currentPreviewPaketId = '';
    });
    $('packageGaugesContainer').addEventListener('click', (e) => {
      const item = e.target.closest('.gauge-item');
      if (item && item.dataset.paketId) togglePackageFilterFromGauge(item.dataset.paketId);
    });
    $('settingHideAnswerKey').addEventListener('change', () => {
      const hidden = $('settingHideAnswerKey').checked;
      $('hideKeyStatusText').textContent = hidden
        ? 'Active (ON) — Answer keys & explanations are HIDDEN from students.'
        : 'Inactive (OFF) — Answer keys & explanations are VISIBLE to students.';
    });

    // Boot
    initDashboard();
  </script>
</body>
</html>
